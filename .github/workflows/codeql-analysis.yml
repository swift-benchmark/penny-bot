name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      languages:
        description: 'Languages to analyze'
        required: true
        default: 'swift'

jobs:
  analyze:
    name: Analyze
    runs-on: macos-latest
    permissions:
      contents: write
      security-events: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ github.event.inputs.languages || 'swift' }}
          build-mode: manual

      # Package.swift declares .macOS(.v15), but under tracing the dependencies
      # get compiled against a 10.13-era target and fail with
      # "concurrency is only available in macOS 10.15.0 or newer".
      # Pin the triple explicitly so it applies to the whole build graph.
      - name: Build
        run: |
          swift build -Xswiftc -target -Xswiftc arm64-apple-macosx15.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ github.event.inputs.languages || 'swift' }}"