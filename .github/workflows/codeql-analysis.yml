name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      languages:
        description: 'Languages to analyze'
        required: true
        default: 'swift'

jobs:
  analyze:
    name: Analyze
    # Linux, not macOS: this is an AWS Lambda project and parts of it use APIs
    # that Swift marks unavailable on Darwin (`system` in GHHooks), so the
    # package cannot build on a macOS runner at all. swift:6.3-noble is the
    # image the project's own test.yml and Dockerfile build with.
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    permissions:
      contents: write
      security-events: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ github.event.inputs.languages || 'swift' }}
          build-mode: manual

      - name: Build
        run: swift build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ github.event.inputs.languages || 'swift' }}"
